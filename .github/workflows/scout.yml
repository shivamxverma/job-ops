name: JobOps Scout
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run scout (HN Who is Hiring)
        run: node scripts/scout.mjs
      - name: Run signal scout (funding/hiring-expansion signals)
        run: node scripts/signal-scout.mjs
      - name: Open issues + notify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node gh-tools/notify.mjs
      - name: Commit inbox state
        run: |
          git config user.name "jobops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add inbox/
          git diff --cached --quiet || git commit -m "scout: $(date -u +%F' '%H:%M) run"
          git push
