name: JobOps Scout
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # scripts/lib/today.mjs stamps files with the machine's local date; the runner is UTC.
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # All six scriptable scouts (HN thread, HN job stories, remote boards, YC grid, Indian
      # startup ATS boards, funding signals). scout-all is fault-tolerant: one dead source is
      # reported and the rest still run. The browser scouts (X, LinkedIn, network) are never
      # run here: they act on Shivam's logged-in accounts and stay manual by design.
      - name: Run all scriptable scouts
        run: node scripts/scout-all.mjs
      - name: Open issues + notify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node gh-tools/notify.mjs
      - name: Commit inbox state
        run: |
          git config user.name "jobops-bot"
          git config user.email "actions@users.noreply.github.com"
          # Same union merge local clones use (see .gitattributes), so a push that races a
          # push from Shivam's machine rebases cleanly instead of failing on scout state.
          git config merge.jsonunion.driver "node scripts/merge-json.mjs %O %A %B"
          git add inbox/
          git diff --cached --quiet && exit 0
          git commit -m "scout: $(date -u +%F' '%H:%M) run"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          exit 1
