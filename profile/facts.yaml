  - title: Fullstack Developer Intern
    company: poiro.com
    company_one_liner: TODO(shivam)
    team: "6-15 engineers"  # 2026-10-20
    dates: Late Jul 2026 - present
    stack: Python, FastAPI, MongoDB (Beanie, Motor), Redis, Celery, asyncio, Cloudflare R2, TypeScript, Next.js, React Flow, Turborepo
    # Replaced 2026-10-28 with Shivam's work report (self-profile/projects/poiro-work-report.md,
    # read from the code on `dev` on 2026-10-28). All earlier poiro work (Flowboard node/group
