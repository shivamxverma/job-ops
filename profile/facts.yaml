    # numbers, dedup prototype) was removed at his request: do not bring any of it back.
    # The report reads code, not git history, so it does not say who wrote which line.
    bullets:
      - "Creative Asset Manager (CAM): one library for uploads, stock imports and AI generations, with one shared UI package used by 3 web apps. Every generation path files through one function (register_produced_asset), which copies the output out of the provider's expiring URL into our own storage under a key built from its content, so each file is stored once, and keeps the model, prompt and reference images for every asset."
      - "Filing never fails the user's job: if an asset can't be saved now, the call is recorded as a pending filing and a background task retries it later."
      - "Stock adapter: Unsplash, Pixabay and Pinterest behind one adapter base class (search, get_download), so adding a provider means adding one adapter. Before every call the runtime checks the provider is switched on and the spend limit allows it; search results are cached in Redis per org (never across orgs, which would reveal another org's searches); imports cap bytes read, concurrency and per-user rate, and hash the bytes that arrived; a changed provider response returns a 502 naming the missing field instead of a crash."
      - "Worker event loop: each Celery worker process keeps one asyncio loop running on its own thread that synchronous tasks submit work to, so idle Mongo heartbeats keep running and clients bound to a loop (httpx, PyMongo, R2) don't break between tasks. Tasks pass a coroutine factory so Celery retries get a fresh coroutine; many threads share the loop so their waits overlap; timeouts cancel with time to clean up; a dead loop exits the process; forked children start their own loop; shutdown closes Mongo, leftover work, Redis, Forge and R2 in a fixed order."
      - "One shared database client: in the Forge worker, one Mongo client, one blocking Redis pool and one orchestrator per loop shared by all tasks, replacing a new set per task (in a burst a task waits briefly for a connection instead of failing mid-job). In the main backend, a loop-bound client that refuses any other loop, with Beanie initialised once per worker process and process state reset after fork."
      - "MCP auth for outside AI agents: one connection is one grant (one user, one org, scopes apps:read / apps:run / assets:write, per-day and per-run credit caps); RS256 access tokens up to 1 hour; rotating refresh tokens where reusing an old one revokes the grant; other services verify tokens against auth-service's JWKS so they can check but not create them; the grant is re-checked on every request; agent-started runs and assets are labelled submitted_via=mcp."
      - "Elements: a named set of reference images for a character, prop or location with a handle such as @char_hero. Create, edit, delete, restore and add images; handles come from the name and a clash is refused rather than silently suffixed; the 8-image cap is checked under an org lock so two concurrent adds can't both slip past it."
    open_work_not_shipped:
      # Interview material only. Say "planned" / "not built yet", never "shipped".
      - "Elements in the prompt box: nothing on dev turns @handle in a prompt into the element's images yet."
      - "Flowboard drag speedup: a written plan only (docs/plans/flowboard-drag-render.md, 'Nothing here is implemented'). Idea: only the canvas re-renders per drag frame instead of the ~8,600-line board page, via a zustand store while keeping React Flow controlled. Trade-offs are in the report."
