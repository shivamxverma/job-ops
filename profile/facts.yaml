projects:
  # Framing keys: backend_framing (infra / systems roles), fullstack_framing (product roles),
  # ai_framing (applied-AI / automation roles). Same true work, lead with what the reader cares about.
  # Dates: Shivam says all were built in 2025 (2026-10-20) unless stated otherwise.
  - name: Yuvro
    built: 2025
    github: https://github.com/shivamxverma/yuvro
    demo: https://drive.google.com/file/d/1Tb_NXvNCp8AcG48K_PUl4GhvSY1ZqiAY/view?usp=sharing
    backend_framing: >-
      Cloud Web IDE split into four planes: a React client, a FastAPI init-service for auth and
      metadata, a FastAPI orchestrator that provisions per-project Kubernetes deployments,
      services, ingress and optional databases, and a thin runner in each workspace that streams
      PTY sessions over WebSockets, serves file APIs and proxies ports. File contents can be
      SHA-256 content-addressed in S3 with template manifests and scheduled garbage collection
      of unreferenced files. The file tree is a self-referential Postgres `nodes` table indexed
      on (project_id, parent_id), (project_id, parent_id, name) and (project_id, type).
    fullstack_framing: Browser IDE with editor, file tree, terminal tabs, live app preview and a read-only database browser, each project in its own on-demand container on Kubernetes.
    caveat: Runner storage is node-local hostPath, not shared multi-node storage.
    stack: Python, FastAPI, PostgreSQL, Kubernetes, AWS S3, WebSockets, React, TypeScript, Vite
  - name: CodeSM
    built: 2025
    github: https://github.com/shivamxverma/CodeSM
    live: https://code-sm.vercel.app/
    demo: https://drive.google.com/file/d/14yYXcVnDkhD8G58OHCsVnmVJN5C3Xait/view
    backend_framing: >-
      Remote code execution engine. The API stores a PENDING submission and enqueues it on
      BullMQ + Redis, so grading runs outside the request. Untrusted C, C++, Java, Go, Python
      and JavaScript run in Docker with no network, a read-only root filesystem, a 64 MB tmpfs,
      all capabilities dropped, no-new-privileges, 256 MB memory, 32 PIDs, 0.5 CPU and a
      timeout. One container is reused across a submission's test cases via docker exec, then
      destroyed. Test cases load from S3 one at a time with early exit on the first failure.
      API and workers share one Drizzle/PostgreSQL schema (migrated from MongoDB).
    ai_framing: Gemini generates four progressive hints per problem and resume-personalized interview questions with written-answer scoring; Murf AI voices the questions.
    never_claim:
      - "Container pooling across submissions. It is one container per submission."
      - "Real users or production load. Shivam has used it for testing only (2026-10-20)."
      - "The ~300ms startup vs <5ms docker exec figure, until Shivam benchmarks it himself."
    todo: "TODO(shivam): benchmark container startup vs docker exec so it becomes a quotable number."
    stack: Node.js, Express.js, TypeScript, BullMQ, Redis, PostgreSQL, Drizzle, Docker, AWS EC2, S3, React, Gemini
  - name: DeepDoc
    built: "Jul 2025 prototype, rebuilt Oct 2026"
    github: https://github.com/shivamxverma/DeepDoc
    ai_framing: >-
      Personal PDF question-answering app. Structure-aware semantic chunking that keeps
      headings and bullets with their section, document-scoped Pinecone retrieval, follow-up
      questions rewritten into standalone queries from DB-backed chat history, and ranked,
      deduplicated context packed into a token budget. A 36-case evaluation harness (6
      multi-turn, including Hinglish and prompt-injection cases) replays retrieval parameter
      sweeps, A/B tests prompts and separates indexing, retrieval and generation failures.
      Fixed a metadata bug that blanked every retrieved chunk.
    tuning_combinations: "100+ configurations"  # settled by the 2026-10-20 resume
    never_claim:
      - "Accuracy improvement percentages, production users, OCR, background workers, or auth. None exist."
    stack: Next.js 15, TypeScript, Azure OpenAI (gpt-4o-mini, text-embedding-3-small), Pinecone, PostgreSQL, Drizzle, Vercel Blob
  - name: Hireflow
    built: 2025
    github: https://github.com/shivamxverma/hireflow
    used_for_real: true  # Shivam used it for his own job applications (2026-10-20)
    applications_sent: TODO(shivam)
    ai_framing: >-
      AI job-application engine. Ingests listings from LinkedIn, Wellfound, YC Work at a Startup
      and Telegram (GramJS), parses stack and seniority with Gemini, rewrites resume bullets
      with GPT-4o-mini, then runs a validator that rejects any rewritten skill not in the
      candidate's real profile, so the output cannot invent skills. Applies through Playwright.
      Shivam used it for his own real applications.
    backend_framing: >-
      Ingestion, AI processing and browser automation are decoupled on BullMQ queues so a
      bot-detection block in one stage cannot stall the others, and third-party rate limits are
      respected. Cross-source dedup uses SHA-256 fingerprints of the normalised title, company
      and description.
    stack: Node.js, TypeScript, BullMQ, Redis, PostgreSQL, Playwright, GramJS, Gemini, GPT-4o-mini
  - name: Storix
    built: 2025
    github: https://github.com/shivamxverma/Storix
    live: https://async-doc.vercel.app
    backend_framing: >-
      Async PDF ingestion pipeline. FastAPI accepts the upload, Celery workers extract off the
      request path, and Redis pub/sub relays worker events to the Next.js client over WebSockets,
      so the user sees each stage live instead of waiting blind.
    stack: FastAPI, Celery, Redis, PostgreSQL, AWS S3, Next.js, TypeScript, WebSockets
  - name: Chatterly
    built: 2025
    github: https://github.com/shivamxverma/chatterly
    backend_framing: >-
      Real-time chat where Kafka decouples message ingestion from delivery and persistence:
      workers batch writes to Postgres while Redis pub/sub fans Socket.io events across server
      instances, so users on different nodes share a room. Worked through Kafka offset handling
      for delivery guarantees and reconnection handling.
    stack: Node.js, Socket.io, Apache Kafka, Redis, PostgreSQL, Prisma, Next.js, TypeScript
  - name: founder-outreach-ai
    private_repo: true  # no public link — describe it, never link it
    ai_framing: >-
      Personal knowledge base and prompt pipeline for cold outreach: his experience, skills and
      projects stored as structured markdown, a startup-analysis framework that infers a
      company's likely engineering bottlenecks, and a 4-part DM framework (hook, bottleneck,
      proof, low-pressure ask). Used for a founder DM campaign in June 2026 (results not
      recorded, never quote a reply rate).
    stack: Markdown knowledge base, LLM prompt engineering

